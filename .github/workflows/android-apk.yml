name: Build Android APK

# Builds an installable APK in CI so it can be downloaded straight to a phone
# from GitHub's web UI — no local Android toolchain, and no Termux.
#
# Builds the *release* variant, not debug, for one decisive reason: React
# Native only embeds the JS bundle into variants outside `debuggableVariants`
# (which defaults to `["debug"]`). A debug APK expects to fetch its JS from a
# running Metro dev server, so installing one would put you right back on the
# dev-server workflow this exists to avoid.
#
# Release APKs must be signed to install at all, and Expo's template already
# points the release buildType at the bundled debug keystore — verified to be
# a fixed template asset, byte-identical across prebuilds, so updates install
# over each other rather than demanding an uninstall. That keystore is the
# well-known public one, so this APK is fine for sideloading onto your own
# phone and must never be published to a store as-is.
on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Needed to publish the APK as a release asset, which is what makes it
    # installable straight from a phone browser.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # The first release build took 22 minutes, nearly all of it Gradle
      # resolving dependencies and compiling from cold. Keyed on the Gradle
      # wrapper and build scripts, which `prebuild` regenerates deterministically
      # from app.json, so the key only changes when the native config does.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/app.json', 'apps/mobile/package.json', 'package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # The root scripts already fan out across workspaces. A red build here
      # is worth more than a shipped APK that crashes.
      - name: Verify before building
        run: |
          npm run typecheck
          npm test

      # `prebuild` generates the native android/ project from app.json. It is
      # gitignored, so this regenerates it from scratch on every run rather
      # than depending on committed native code that could drift.
      - name: Generate native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK after the commit
        id: rename
        run: |
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
             "dist/showdown-mobile-${GITHUB_SHA::7}.apk"
          echo "name=showdown-mobile-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # Actions artifacts are only served as ZIPs, and only to users who are
      # signed in — awkward on a phone, where extracting an archive means
      # installing a file manager first. A release asset is a plain .apk over
      # a direct link, so Android's browser hands it straight to the package
      # installer. /releases/latest always points at the newest build.
      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="apk-${GITHUB_SHA::7}"
          # Re-running a build for the same commit should replace its release
          # rather than fail on the existing tag.
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" "dist/${{ steps.rename.outputs.name }}.apk" \
            --target "$GITHUB_SHA" \
            --title "Showdown Mobile ${GITHUB_SHA::7}" \
            --notes 'Tap the `.apk` below to install. Requires Android 7.0 or
          newer, and permission to install from your browser.

          Signed with the Android debug keystore that ships in the Expo
          template, so it installs by sideloading only and must never be
          published to a store as-is. That keystore is fixed rather than
          generated per build, so each new version installs over the previous
          one without an uninstall.'
